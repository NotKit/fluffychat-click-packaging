name: Clickable Build

on:
  push:

jobs:
  build:
    strategy:
      # Keep one arch building when the other's runner breaks, so a flaky
      # container runtime on one image doesn't cancel the other's artifact.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            # Pinned: ubuntu-latest ships a podman/crun combo that fails to
            # start any container ("unknown version specified").
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: armhf
            # No 32-bit ARM runner exists; this is a cross build from amd64.
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      # One definition for both the restore and the save below: if the two keys
      # ever drifted apart the cache would silently never hit.
      # Both arches now build with fontconfig; the '-fc' suffix busts the old
      # no-fontconfig cache so the engine actually rebuilds.
      ENGINE_CACHE_KEY: flutter-release-engine-v3-${{ matrix.arch }}-4c525dac5ebe5971c5708ef73558ed8edcf4a362-fc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          # Full history so the fluffychat submodule's tags are reachable for
          # `git describe` below (a shallow checkout has no tags -> empty version).
          fetch-depth: 0
      - name: Parse version
        run: |
          # submodule update fetches only the pinned commit, not tags; fetch them
          # so git describe can name the version.
          git -C fluffychat fetch --tags --force
          # Match only release tags (v*); the commit may also carry an rc* tag
          # that git describe would otherwise pick, mangling the version.
          UPSTREAM=$(cd fluffychat && git describe --tags --match 'v*' | awk '{print substr($0,2); }')
          # Same upstream-plus-packaging-revision version build.sh stamps into
          # the manifest, so artifact names match the .click version.
          echo ARTIFACT_VERSION=${UPSTREAM}-$(tr -d '[:space:]' < packaging-revision) >> $GITHUB_ENV
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/boost \
                      /opt/ghc /usr/local/.ghcup /usr/lib/jvm /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install clickable
        run: |
          python3 -m pip install clickable-ut

      # restore/save rather than actions/cache: that one only saves in its post
      # step, which is skipped when the job fails, so a later failure would throw
      # away a good engine build and make the next run redo the whole thing.
      - name: Restore Flutter release engine cache
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: build/engine-artifacts/${{ matrix.arch }}
          key: ${{ env.ENGINE_CACHE_KEY }}

      - name: Cache Rust toolchain + vodozemac build
        uses: actions/cache@v4
        with:
          path: |
            build/rustup
            build/cargo
            build/vodozemac-target
          key: vodozemac-rust-${{ matrix.arch }}-${{ hashFiles('fluffychat/pubspec.lock') }}

      - name: Build Flutter release engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          # libfontconfig dev headers/lib for the --enable-fontconfig build. The amd64 host
          # build and the native arm64 runner both link against the runner's system libs;
          # the armhf cross build takes fontconfig from its target sysroot instead.
          sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          export PATH="/tmp/depot_tools:$PATH"

          mkdir /tmp/engine_src && cd /tmp/engine_src

          # Pre-clone so we can patch DEPS before gclient reads it (managed=False
          # then just uses the existing checkout).
          git init -q .
          git fetch --depth 1 https://github.com/flutter/flutter.git 4c525dac5ebe5971c5708ef73558ed8edcf4a362
          git checkout -q FETCH_HEAD

          # Remove the openjdk DEPS entry: download_jdk var is ignored for CIPD deps and
          # the linux-arm64 package doesn't exist, breaking sync on the arm64 runner.
          # System interpreter: depot_tools' python3 shim shadows it on PATH but
          # only works after gclient sync has bootstrapped depot_tools below.
          /usr/bin/python3 - << 'PY'
          import re
          with open('DEPS') as f:
              deps = f.read()
          new_deps, n = re.subn(
              r"^  'engine/src/flutter/third_party/java/openjdk':\s*\{[\s\S]+?^   \},\s*\n",
              '', deps, flags=re.MULTILINE,
          )
          assert n == 1, f"Expected 1 openjdk DEPS entry, found {n}"
          with open('DEPS', 'w') as f:
              f.write(new_deps)
          PY

          # Skip android/emsdk/fuchsia deps (not needed; fuchsia SDK alone is several GB).
          cat > .gclient << 'EOF'
          solutions = [
            {
              "managed": False,
              "name": ".",
              "url": "https://github.com/flutter/flutter.git@4c525dac5ebe5971c5708ef73558ed8edcf4a362",
              "deps_file": "DEPS",
              "safesync_url": "",
              "custom_vars": {
                "download_android_deps": False,
                "download_emsdk": False,
                "download_fuchsia_deps": False,
              },
            },
          ]
          EOF
          gclient sync --no-history -D --shallow

          # arm64/arm require --target-os=linux --linux-cpu=...; without it the gn wrapper
          # defaults target_cpu=x64 on Linux hosts, producing wrong -march flags.
          # x64 uses the default host build (out/host_release); arm64 uses out/linux_release_arm64.
          # Build Skia's fontconfig font manager into the engine (all arches).
          # --enable-fontconfig sets skia_use_fontconfig + flutter_use_fontconfig so the
          # engine resolves system fonts (and glyph fallback) via fontconfig instead of
          # the bundled DejaVu directory manager.
          GN_ARGS="--runtime-mode=release --no-goma --enable-fontconfig"
          OUT_DIR=host_release
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            GN_ARGS="$GN_ARGS --target-os=linux --linux-cpu=arm64"
            OUT_DIR=linux_release_arm64
          elif [ "${{ matrix.arch }}" = "armhf" ]; then
            # Cross build from amd64. This engine version has no default arm32
            # sysroot in sysroot.gni (only x64/arm64/riscv64), but the Debian
            # bullseye armhf sysroot is still published in sysroots.json, so
            # install it and pass it explicitly. UT armhf userland is hard-float.
            python3 engine/src/build/linux/sysroot_scripts/install-sysroot.py --arch=arm
            SYSROOT=$(ls -d "$PWD"/engine/src/build/linux/debian_*armhf*sysroot* | head -1)
            if [ -z "$SYSROOT" ]; then
              echo "ERROR: armhf sysroot did not install" >&2
              exit 1
            fi
            # The engine only emits a clang --target= for arm64, so an arm build
            # would compile ARM flags against the x86_64 host triple.
            patch -d engine/src -p1 \
              < "$GITHUB_WORKSPACE/patches/engine-linux-arm-triple.patch"

            GN_ARGS="$GN_ARGS --target-os=linux --linux-cpu=arm --arm-float-abi=hard --target-sysroot $SYSROOT"
            OUT_DIR=linux_release_arm
          fi
          cd engine/src/flutter
          python3 tools/gn $GN_ARGS
          if [ "${{ matrix.arch }}" = "armhf" ]; then
            # Cross build: gen_snapshot has to run on the x64 build host, so take
            # it from the clang_x64 secondary toolchain. No fallback to the
            # default-toolchain target — that one is an ARM binary the host
            # cannot execute, and copying it would poison the engine cache.
            ninja -C ../out/$OUT_DIR libflutter_engine.so clang_x64/gen_snapshot
          else
            ninja -C ../out/$OUT_DIR libflutter_engine.so gen_snapshot
          fi

          echo "=== gen_snapshot candidates in out/$OUT_DIR ==="
          find ../out/$OUT_DIR -name gen_snapshot -type f | head -10

          ARCH=${{ matrix.arch }}
          mkdir -p "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH"
          cp ../out/$OUT_DIR/libflutter_engine.so \
             "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH/libflutter_engine.so"

          # Prefer the clang_x64 (build-host) gen_snapshot: in a cross build the
          # default-toolchain one is a target-arch binary the host cannot run.
          GEN_SNAPSHOT_SRC=$(find ../out/$OUT_DIR -path '*clang_x64*' -name gen_snapshot -type f | head -1)
          if [ -z "$GEN_SNAPSHOT_SRC" ]; then
            GEN_SNAPSHOT_SRC=$(find ../out/$OUT_DIR -name gen_snapshot -type f | head -1)
          fi
          if [ -z "$GEN_SNAPSHOT_SRC" ]; then
            echo "ERROR: gen_snapshot not found anywhere under out/$OUT_DIR" >&2
            exit 1
          fi
          echo "Copying gen_snapshot from: $GEN_SNAPSHOT_SRC"
          cp "$GEN_SNAPSHOT_SRC" "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH/gen_snapshot"
          chmod +x "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH/gen_snapshot"

          # icudtl.dat: ship Flutter's compact ICU data (arch-independent). This used to
          # survive only via the engine cache; the build step never produced it, so busting
          # the cache lost it. Source it from the checkout (cwd is engine/src/flutter here).
          ICU_DAT="third_party/icu/flutter/icudtl.dat"
          if [ ! -f "$ICU_DAT" ]; then
            echo "ERROR: icudtl.dat not found at engine/src/flutter/$ICU_DAT" >&2
            exit 1
          fi
          cp "$ICU_DAT" "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH/icudtl.dat"

          # flutter_embedder.h: the embedder API header (prebuild step copies it into the
          # embedder source tree for the cmake build). Same latent cache-only gap as icudtl.dat;
          # it's just embedder.h from the checkout (cwd is engine/src/flutter here).
          mkdir -p "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH/include"
          cp shell/platform/embedder/embedder.h \
             "$GITHUB_WORKSPACE/build/engine-artifacts/$ARCH/include/flutter_embedder.h"

          # Free the source tree; only the .so is needed going forward
          rm -rf /tmp/engine_src /tmp/depot_tools

      # Placed right after the build so a failure further down the job (app
      # build, packaging) still leaves the engine cached for the next run.
      - name: Save Flutter release engine cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/engine-artifacts/${{ matrix.arch }}
          key: ${{ env.ENGINE_CACHE_KEY }}

      - name: Verify engine artifacts
        run: |
          DIR=build/engine-artifacts/${{ matrix.arch }}
          echo "=== Engine artifacts for ${{ matrix.arch }} ==="
          ls -lh $DIR/
          file $DIR/libflutter_engine.so
          file $DIR/gen_snapshot

          # Assert the arches, so a restored-from-cache or mis-toolchained
          # artifact fails here instead of deep in the app build. The engine is
          # a target binary; gen_snapshot must run on this runner.
          case ${{ matrix.arch }} in
            amd64) ENGINE_ARCH="x86-64" ;;
            arm64) ENGINE_ARCH="ARM aarch64" ;;
            armhf) ENGINE_ARCH="ARM," ;;
          esac
          HOST_ARCH=$(file -b "$(command -v file)" | grep -o 'x86-64\|ARM aarch64')
          file -b $DIR/libflutter_engine.so | grep -q "$ENGINE_ARCH" || {
            echo "ERROR: libflutter_engine.so is not $ENGINE_ARCH" >&2; exit 1; }
          file -b $DIR/gen_snapshot | grep -q "$HOST_ARCH" || {
            echo "ERROR: gen_snapshot is not runnable on this $HOST_ARCH host" >&2; exit 1; }
          echo "OK: engine is $ENGINE_ARCH, gen_snapshot is host ($HOST_ARCH)"

      - name: Build libraries
        run: |
          clickable build --libs --arch ${{ matrix.arch }}
      - name: Build
        run: |
          clickable build --accept-review-warnings --arch ${{ matrix.arch }}
      - name: Assert libapp.so is product-mode
        run: |
          # A non-product snapshot carries "no-dedup_instructions" and aborts at VM init.
          CLICK=$(find build -name "*.click" 2>/dev/null | head -1)
          dpkg-deb -x "$CLICK" /tmp/click_inspect
          LIBAPP=/tmp/click_inspect/lib/libapp.so
          FEATURES=$(strings -n 10 "$LIBAPP" | grep -E "(product|release) no-code_comments" | head -1)
          echo "libapp.so features: $FEATURES"
          if echo "$FEATURES" | grep -q "no-dedup_instructions"; then
            echo "ERROR: libapp.so was built with a non-product gen_snapshot (no-dedup_instructions)" >&2
            exit 1
          fi
          echo "OK: libapp.so is product-mode (dedup_instructions)"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat.notkit_${{ env.ARTIFACT_VERSION }}_${{ matrix.arch }}
          path: build/*/app/*.click
          if-no-files-found: error

  # Publish the per-arch .click packages to a rolling "continuous" prerelease so
  # they can be downloaded without a GitHub login (Actions artifacts require
  # auth). Mirrors initramfs-tools-halium's use of a continuous tag.
  release:
    name: Publish continuous release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # softprops/action-gh-release updates an existing release's assets but
      # won't move an existing git tag to the new commit. Delete the old release
      # and its tag first so "continuous" always points at the latest master
      # build and stale assets don't linger.
      - name: Remove previous continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --cleanup-tag --yes \
            --repo "$GITHUB_REPOSITORY" || true

      - name: Publish to the continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: Continuous build
          prerelease: true
          files: artifacts/**/*.click
          fail_on_unmatched_files: true
          body: |
            Rolling build of the latest `master` commit
            (${{ github.sha }}), refreshed on every push to `master`.

            Not a stable release. Install the `.click` for your device's
            architecture with `clickable install` or the OpenStore's local
            install.

  # Publish a permanent, stable release when a v* tag is pushed. The tag names
  # the release; assets are the same per-arch .click packages the build job
  # produced for that tagged commit.
  release-tag:
    name: Publish tagged release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release for the tag
        uses: softprops/action-gh-release@v2
        with:
          # tag_name defaults to the pushed tag (github.ref).
          name: ${{ github.ref_name }}
          prerelease: false
          files: artifacts/**/*.click
          fail_on_unmatched_files: true
          body: |
            FluffyChat ${{ github.ref_name }} for Ubuntu Touch.

            Install the `.click` for your device's architecture with
            `clickable install` or the OpenStore's local install.
